name: Zig CI

on:
  push:
    branches:
      - main
      - master
      - feature-json

  pull_request:
    branches:
      - main
      - master
      - feature-json

jobs:
  build-and-test:
    name: Build and Test
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Zig
        uses: mlugg/setup-zig@v2
        with:
          version: 0.16.0

      - name: Check Zig version
        run: zig version

      - name: Build
        run: zig build

      - name: Run JSON tests
        run: zig build test-json

      - name: Run all tests
        run: zig build test